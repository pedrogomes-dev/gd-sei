name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

env:
  APP_ENV: development
  DEV_AUTH_ENABLED: 'false'
  COOKIE_SECURE: 'false'

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip check
      - run: python -m ruff format --check gdsei config manage.py
      - run: python -m ruff check gdsei config manage.py
      - run: python manage.py check
      - run: python manage.py collectstatic --noinput
      - run: python manage.py test gdsei

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-dev.txt
      - run: python manage.py check
      - run: python manage.py collectstatic --noinput
      - run: node --check gdsei/static/gdsei/app.js
      - run: python manage.py test gdsei.tests.test_aplicacao.AplicacaoTests
